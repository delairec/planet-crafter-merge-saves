name: UI tests

# Scenario suite of ui-save-manager. It runs on the pull requests targeting the production branch and
# on demand, never on the task pull requests targeting an integration branch. Do not make it a
# required check: a pull request it does not trigger on would stay blocked forever.
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/ui-save-manager
      - run: bun run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/ui-save-manager/playwright-report/
            packages/ui-save-manager/test-results/
          retention-days: 7
