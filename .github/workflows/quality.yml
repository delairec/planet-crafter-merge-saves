name: Quality

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          format: github-summary
      - uses: fallow-rs/fallow@v3
        with:
          command: health
          format: github-summary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:types

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:guards

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The runner image ships a Node older than the range `engines.node` declares.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run the test suite, which spawns the node:* commands as real Node processes
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
