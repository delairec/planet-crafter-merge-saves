entry = [
    "packages/cli-merge/cli/merge-cli.js",
    "packages/cli-validate/cli/validate-cli.js",
    "packages/ui-save-manager/src/entry-client.tsx",
    "packages/ui-save-manager/src/entry-server.tsx",
    "packages/**/*.spec.js",
    "packages/**/*.spec.ts",
]

ignorePatterns = [
    "output/**",
    "input/**",
    "packages/ui-save-manager/**",
    "packages/util-messages/**",
]

ignoreDependencies = [
    "bun",
    "@types/bun",
    "typescript",
    "ui-save-manager"
]

[audit]
gate = "new-only"

[health]


[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "warn"
unresolved-imports = "error"
